<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" viewBox="0 0 1540 1200" role="img" aria-labelledby="title description">
  <title id="title">Nacre water supply</title>
  <desc id="description">Six representative water districts, their sources and treatment plants, and three directed treated-water transfers.</desc>
  <defs>
    <linearGradient id="sea" x2="0" y2="1">
      <stop stop-color="#1f3e50"/>
      <stop offset="1" stop-color="#172b3b"/>
    </linearGradient>
    <pattern id="graticule" width="66" height="66" patternUnits="userSpaceOnUse">
      <path d="M 66,0 H 0 V 66" fill="none" stroke="#bdd0d7" stroke-opacity=".11"/>
    </pattern>
    <clipPath id="map-frame"><rect x="48" y="171" width="1052" height="786" rx="12"/></clipPath>
    <marker id="water-arrow" viewBox="0 0 8 8" refX="13" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0,0 8,4 0,8 Z" fill="#9ce8d9"/>
    </marker>
    <marker id="aid-arrow" viewBox="0 0 8 8" refX="13" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0,0 8,4 0,8 Z" fill="#ffdbab"/>
    </marker>
    <marker id="flow-arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0,0 8,4 0,8 Z" fill="#376976"/>
    </marker>
    <style>
      text { font-family: 'DejaVu Sans', sans-serif; }
      .ink { fill: #253947; }
      .muted { fill: #506575; }
      .light { fill: #f4f7f7; }
      .caps { font-size: 13px; font-weight: 700; letter-spacing: 2px; }
      .title { font-size: 54px; font-weight: 700; letter-spacing: -2px; }
      .subtitle { font-size: 18px; }
      .body { font-size: 15px; font-weight: 700; }
      .support { font-size: 13px; }
      .small { font-size: 12px; }
      .place { fill: #fff8ee; stroke: #1c2e3c; stroke-width: 4px; stroke-linejoin: round; paint-order: stroke fill; font-weight: 700; font-size: 16px; }
      .sidebar { fill: #fffcf6; stroke: #cbd1d2; }
      .divider { stroke: #cbd1d2; }
      .main, .aid, .supply { fill: none; stroke-width: 3.1; stroke-linejoin: round; stroke-linecap: round; }
      .main { stroke: #9ce8d9; }
      .aid { stroke: #ffdbab; stroke-dasharray: 8 5; }
      .supply { stroke: #d9e9ee; stroke-width: 1.8; stroke-dasharray: 2 5; }
      .route-id { fill: #eff6f6; font: 700 11px 'DejaVu Sans Mono', monospace; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1540" height="1200" fill="#f3f0e8"/>
  <text x="48" y="56" class="caps muted">SYNTHETIC EXERCISE WORLD ATLAS</text>
  <text x="48" y="115" class="title ink">Nacre water supply</text>
  <text x="51" y="145" class="subtitle muted">Sources, treatment, local distribution, and treated-water transfers</text>
  <text x="1492" y="56" text-anchor="end" class="caps muted">WORLD EXTENSION</text>
  <path d="M 48,1168 H 1492" class="divider"/>
  <text x="48" y="1186" class="support muted">Schematic locations and connections · Basemap adapted from the Synthetic Exercise World atlas</text>
  <text x="1492" y="1186" text-anchor="end" class="support muted">CC BY 4.0</text>

