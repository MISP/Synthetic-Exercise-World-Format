  <text x="1173" y="282" class="support muted">Mesa Waterworks</text>
  <g transform="translate(1154 305)"><circle r="9" fill="#d7f4ed" stroke="#183643" stroke-width="2"/><path d="M -4,1 Q -2,-2 0,1 T 4,1 M -3,4 H 3" fill="none" stroke="#275967" stroke-width="1.3"/></g>
  <text x="1173" y="309" class="body ink">Ilyndor Water District</text>
  <text x="1173" y="327" class="support muted">Corridor Wellfield</text>
  <text x="1173" y="344" class="support muted">Corridor Waterworks</text>
  <g transform="translate(1154 367)"><circle r="9" fill="#d7f4ed" stroke="#183643" stroke-width="2"/><path d="M -4,1 Q -2,-2 0,1 T 4,1 M -3,4 H 3" fill="none" stroke="#275967" stroke-width="1.3"/></g>
  <text x="1173" y="371" class="body ink">Neruva Water District</text>
  <text x="1173" y="389" class="support muted">Delta River Intake</text>
  <text x="1173" y="406" class="support muted">Delta Waterworks</text>
  <g transform="translate(1154 429)"><circle r="9" fill="#d7f4ed" stroke="#183643" stroke-width="2"/><path d="M -4,1 Q -2,-2 0,1 T 4,1 M -3,4 H 3" fill="none" stroke="#275967" stroke-width="1.3"/></g>
  <text x="1173" y="433" class="body ink">Brinax Water District</text>
  <text x="1173" y="451" class="support muted">Tidegate Seawater Intake</text>
  <text x="1173" y="468" class="support muted">Tidegate Desalination Plant</text>
  <g transform="translate(1154 491)"><circle r="9" fill="#d7f4ed" stroke="#183643" stroke-width="2"/><path d="M -4,1 Q -2,-2 0,1 T 4,1 M -3,4 H 3" fill="none" stroke="#275967" stroke-width="1.3"/></g>
  <text x="1173" y="495" class="body ink">Orinthia Water District</text>
  <text x="1173" y="513" class="support muted">Sound Rainwater Reservoir</text>
  <text x="1173" y="530" class="support muted">Sound Waterworks</text>
  <g transform="translate(1154 553)"><circle r="9" fill="#d7f4ed" stroke="#183643" stroke-width="2"/><path d="M -4,1 Q -2,-2 0,1 T 4,1 M -3,4 H 3" fill="none" stroke="#275967" stroke-width="1.3"/></g>
  <text x="1173" y="557" class="body ink">Quenari Water District</text>
  <text x="1173" y="575" class="support muted">Orchard Reservoir</text>
  <text x="1173" y="592" class="support muted">Orchard Waterworks</text>
  <path d="M 1146,613 H 1468" class="divider"/>
  <text x="1146" y="647" class="caps muted">TREATED-WATER TRANSFERS</text>
  <rect x="1146" y="664" width="66" height="77" rx="7" fill="#254153"/>
  <path d="M 1156,687 H 1201" class="main" marker-end="url(#water-arrow)"/>
  <path d="M 1156,720 H 1201" class="aid" marker-end="url(#aid-arrow)"/>
  <text x="1227" y="692" class="support ink">In-service transfer</text>
  <text x="1227" y="725" class="support ink">Mutual aid tie · normally closed</text>
  <text x="1146" y="793" class="small muted">Arrows show the direction of treated-water supply.</text>
  <text x="1146" y="818" class="small muted">Districts without a transfer use local supply here.</text>
  <text x="1146" y="843" class="small muted">The guide lists each plant's electricity dependency.</text>

  <g id="local-supply-key" inkscape:groupmode="layer" inkscape:label="Local supply chain">
    <text x="48" y="975" class="caps muted">LOCAL WATER SUPPLY CHAIN</text>
    <rect x="48" y="992" width="1444" height="143" rx="12" class="sidebar"/>
    <path d="M 1054,1044 H 1186" fill="none"
          stroke="#376976" stroke-width="2" marker-end="url(#flow-arrow)"/>
    <path d="M 692,1044 H 824" fill="none" stroke="#376976" stroke-width="2" marker-end="url(#flow-arrow)"/>
    <path d="M 330,1044 H 462" fill="none" stroke="#376976" stroke-width="2" marker-end="url(#flow-arrow)"/>
    <text x="80" y="1049" class="body ink">Raw water source</text>
    <text x="80" y="1074" class="support muted">Reservoir, wellfield, or intake</text>
    <text x="485" y="1049" class="body ink">Treatment plant</text>
    <text x="485" y="1074" class="support muted">Draws power from the local grid</text>
    <text x="846" y="1049" class="body ink">Distribution district</text>
    <text x="846" y="1074" class="support muted">Delivers treated water locally</text>
    <text x="1207" y="1049" class="body ink">Customers and services</text>
    <text x="1207" y="1074" class="support muted">Households and facilities</text>
  </g>
