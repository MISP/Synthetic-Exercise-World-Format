    <g transform="translate(91 254)" fill="#eaf1f5">
      <text y="-20" x="0" text-anchor="middle" font-size="15" font-weight="700">N</text>
      <path d="M 0,-12 8,11 0,6 -8,11 Z M 0,14 V 26" stroke="#eaf1f5" stroke-width="1.5"/>
    </g>
  </g>
  <g id="water-transfers-layer" inkscape:groupmode="layer" inkscape:label="Treated-water transfers" opacity="1">
    <g id="route-W01" data-state="in-service">
      <title>W01 · Plateau Treated-Water Main</title>
      <path d="M 608,444 C 609,539 575,645 536,714" class="main" marker-end="url(#water-arrow)"/>
      <rect x="571" y="569" width="36" height="18" rx="4" fill="#233c4a" stroke="#a3bcc6" stroke-opacity=".8"/>
      <text x="589" y="582" class="route-id">W01</text>
    </g>
    <g id="route-W02" data-state="normally-closed">
      <title>W02 · Delta Mutual Aid Tie</title>
      <path d="M 536,714 C 653,707 761,727 868,774" class="aid" marker-end="url(#aid-arrow)"/>
      <rect x="679" y="718" width="36" height="18" rx="4" fill="#233c4a" stroke="#a3bcc6" stroke-opacity=".8"/>
      <text x="697" y="731" class="route-id">W02</text>
    </g>
    <g id="route-W03" data-state="in-service">
      <title>W03 · Coastal Treated-Water Main</title>
      <path d="M 777,847 Q 837,833 868,774" class="main" marker-end="url(#water-arrow)"/>
      <rect x="808" y="809" width="36" height="18" rx="4" fill="#233c4a" stroke="#a3bcc6" stroke-opacity=".8"/>
      <text x="826" y="822" class="route-id">W03</text>
    </g>
  </g>
  <g id="water-districts-layer" inkscape:groupmode="layer" inkscape:label="Local water districts">
    <g id="district-CAE">
      <title>Caelum Water District · Mesa Waterworks</title>
      <g transform="translate(608 444)"><circle r="9" fill="#d7f4ed" stroke="#183643" stroke-width="2"/><path d="M -4,1 Q -2,-2 0,1 T 4,1 M -3,4 H 3" fill="none" stroke="#275967" stroke-width="1.3"/></g>
      <text x="591" y="434" text-anchor="end" class="place">Caelum Water District</text>
    </g>
    <g id="district-ILY">
      <title>Ilyndor Water District · Corridor Waterworks</title>
      <g transform="translate(536 714)"><circle r="9" fill="#d7f4ed" stroke="#183643" stroke-width="2"/><path d="M -4,1 Q -2,-2 0,1 T 4,1 M -3,4 H 3" fill="none" stroke="#275967" stroke-width="1.3"/></g>
      <text x="519" y="704" text-anchor="end" class="place">Ilyndor Water District</text>
    </g>
    <g id="district-NER">
      <title>Neruva Water District · Delta Waterworks</title>
      <g transform="translate(868 774)"><circle r="9" fill="#d7f4ed" stroke="#183643" stroke-width="2"/><path d="M -4,1 Q -2,-2 0,1 T 4,1 M -3,4 H 3" fill="none" stroke="#275967" stroke-width="1.3"/></g>
      <text x="885" y="765" text-anchor="start" class="place">Neruva Water District</text>
    </g>
    <g id="district-BRI">
      <title>Brinax Water District · Tidegate Desalination Plant</title>
      <g transform="translate(777 847)"><circle r="9" fill="#d7f4ed" stroke="#183643" stroke-width="2"/><path d="M -4,1 Q -2,-2 0,1 T 4,1 M -3,4 H 3" fill="none" stroke="#275967" stroke-width="1.3"/></g>
      <text x="794" y="872" text-anchor="start" class="place">Brinax Water District</text>
    </g>
    <g id="district-ORI">
      <title>Orinthia Water District · Sound Waterworks</title>
      <g transform="translate(896 426)"><circle r="9" fill="#d7f4ed" stroke="#183643" stroke-width="2"/><path d="M -4,1 Q -2,-2 0,1 T 4,1 M -3,4 H 3" fill="none" stroke="#275967" stroke-width="1.3"/></g>
      <text x="880" y="434" text-anchor="end" class="place">Orinthia Water District</text>
    </g>
    <g id="district-QUE">
      <title>Quenari Water District · Orchard Waterworks</title>
      <g transform="translate(320 834)"><circle r="9" fill="#d7f4ed" stroke="#183643" stroke-width="2"/><path d="M -4,1 Q -2,-2 0,1 T 4,1 M -3,4 H 3" fill="none" stroke="#275967" stroke-width="1.3"/></g>
      <text x="337" y="824" text-anchor="start" class="place">Quenari Water District</text>
    </g>
  </g>
  <rect x="48" y="171" width="1052" height="786" rx="12" fill="none" stroke="#9aafb7"/>
  <rect x="1122" y="171" width="370" height="786" rx="12" class="sidebar"/>
  <text x="1146" y="208" class="caps muted">LOCAL SOURCE AND TREATMENT</text>
