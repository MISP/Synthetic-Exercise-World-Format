<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" viewBox="0 0 1540 990" role="img" aria-labelledby="title description">
  <title id="title">Flags of Nacre — atlas and visual index</title>
  <desc id="description">Ten original flags on the Nacre atlas and a matching visual index. Every flag is labeled with its country and capital in the index.</desc>
  <defs>
    <linearGradient id="sea" x2="0" y2="1">
      <stop stop-color="#234350"/>
      <stop offset="1" stop-color="#1a303c"/>
    </linearGradient>
    <pattern id="graticule" width="62" height="62" patternUnits="userSpaceOnUse">
      <path d="M 62,0 H 0 V 62" fill="none" stroke="#a8c0ce" stroke-opacity=".13"/>
    </pattern>
    <clipPath id="map-frame"><rect x="48" y="171" width="974" height="765" rx="12"/></clipPath>
    <style>
      text { font-family: 'DejaVu Sans', sans-serif; }
      .ink { fill: #233743; }
      .muted { fill: #4e6673; }
      .light { fill: #edf6f6; }
      .caps { font-size: 13px; font-weight: 700; letter-spacing: 2.1px; }
      .title { font-size: 62px; font-weight: 700; letter-spacing: -2px; }
      .subtitle { font-size: 18px; }
      .place { fill: #fff9eb; stroke: #1b303c; stroke-width: 4px; stroke-linejoin: round; paint-order: stroke fill; font-weight: 700; font-size: 15px; }
      .body { font-size: 14px; font-weight: 700; }
      .support { font-size: 13px; }
      .small { font-size: 12px; }
      .sidebar { fill: #fffcf6; stroke: #cad2d1; }
      .card { fill: #f7f5eb; stroke: #d9dcd5; }
      .divider { stroke: #cbd3d2; }
      .water-label { fill: #a7c3cc; font-size: 13px; letter-spacing: 2.5px; }
    </style>
