  <rect width="1540" height="990" fill="#f2efe6"/>
  <text x="48" y="56" class="caps muted">SYNTHETIC EXERCISE WORLD ATLAS</text>
  <text x="48" y="115" class="title ink">Flags of Nacre</text>
  <text x="51" y="145" class="subtitle muted">Find each country by its flag, from the polar dominion to the equatorial league.</text>
  <text x="1492" y="56" text-anchor="end" class="caps muted">WORLD EXTENSION</text>
  <path d="M 48,955 H 1492" class="divider"/>
  <text x="48" y="975" class="support muted">Basemap adapted from the Synthetic Exercise World atlas</text>
  <text x="1492" y="975" text-anchor="end" class="support muted">CC BY 4.0</text>

