<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1440 895" role="img" aria-labelledby="title description">
  <title id="title">Nacre · Seismic hazards</title>
  <desc id="description">Three onshore and two offshore faults, seven monitoring sites, one volcano on Orinthia, and a simulated offshore earthquake epicenter.</desc>
  <style>
    text { font-family: "DejaVu Sans", sans-serif; fill: #ebf4f3; }
    .grid path { stroke: #577989; stroke-dasharray: 3 5; stroke-opacity: .5; }
    .grid text { fill: #a4bfcb; font-size: 12px; }
    .land { fill: #344f59; stroke: #77949c; stroke-width: 1.5; stroke-linejoin: round; fill-rule: evenodd; }
    .country { text-anchor: middle; font-size: 14px; font-weight: 600; fill: #aac7cf; }
    .traces path { fill: none; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
    .traces .onshore, .legend .onshore { stroke: #f6bd79; }
    .traces .offshore, .legend .offshore { stroke: #75dbe1; stroke-dasharray: 8 5; }
    .labels text { text-anchor: middle; font-size: 14px; font-weight: 750; paint-order: stroke; stroke: #182c3b; stroke-width: 4; stroke-linejoin: round; }
    .labels .onshore, .key.onshore { fill: #f6bd79; }
    .labels .offshore, .key.offshore { fill: #75dbe1; }
    .labels .seismic-station { fill: #d8e9a5; }
    .labels .volcano { fill: #ff9d86; }
    .labels .exercise-earthquake { fill: #ffe2f3; }
    .leader { fill: none; stroke: #d2e0e2; stroke-width: 1.1; }
    .divider { stroke: #395360; }
    .heading { fill: #f9e7cf; font-size: 23px; font-weight: 700; }
    .key { font-size: 15px; font-weight: 750; }
    .entry { font-size: 18px; font-weight: 700; }
    .note { fill: #b6cbd5; font-size: 15px; }
    .legend text { fill: #b6cbd5; font-size: 15px; }
  </style>
