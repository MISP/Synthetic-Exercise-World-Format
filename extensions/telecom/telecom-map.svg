<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" viewBox="0 0 1540 1008" role="img" aria-labelledby="title description">
  <title id="title">Nacre telecommunications — access and fiber</title>
  <desc id="description">Ten operators provide fixed and radio service across Nacre. The map distinguishes shared terrestrial and subsea links, a private research cable, unlit reserve fiber, and the domestic-only SteppeWave network.</desc>
  <defs>
    <linearGradient id="sea" x2="0" y2="1">
      <stop stop-color="#173747"/>
      <stop offset="1" stop-color="#102532"/>
    </linearGradient>
    <pattern id="graticule" width="66" height="66" patternUnits="userSpaceOnUse">
      <path d="M 66,0 H 0 V 66" fill="none" stroke="#9fbdc8" stroke-opacity=".13"/>
    </pattern>
    <clipPath id="map-frame"><rect x="48" y="171" width="1052" height="786" rx="12"/></clipPath>
    <style>
      text { font-family: 'DejaVu Sans', sans-serif; }
      .ink { fill: #102f39; }
      .muted { fill: #44616a; }
      .light { fill: #edf5f0; }
      .sea-label { fill: #aec7d1; font-size: 14px; letter-spacing: 3px; }
      .caps { font-size: 13px; font-weight: 700; letter-spacing: 2.2px; }
      .title { font-size: 57px; font-weight: 700; letter-spacing: -2px; }
      .subhead { font-size: 18px; }
      .site-label { fill: #f7fff9; stroke: #122a35; stroke-width: 4px; stroke-linejoin: round; paint-order: stroke fill; font-weight: 700; font-size: 18px; }
      .operator { font-size: 16px; font-weight: 700; }
      .support { font-size: 13px; }
      .access { fill: #245968; font-size: 13px; font-weight: 700; }
      .operator-list { fill: #fdfcf5; stroke: #cbd5ce; }
      .divider { stroke: #cbd5ce; }
      .connection { fill: none; stroke-width: 3.3; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
      .route-outline { fill: none; stroke: #142934; stroke-width: 6; stroke-linecap: round; vector-effect: non-scaling-stroke; }
      .shared-terrestrial { stroke: #84eed0; }
      .shared-subsea { stroke: #91dcff; stroke-dasharray: 10 6; }
      .private-only { stroke: #ffc09d; stroke-dasharray: 2 7; }
      .dark-fiber { stroke: #d3c5ee; stroke-dasharray: 11 6 2 6; }
      .route-id { fill: #f0f7f5; font: 700 12px 'DejaVu Sans Mono', monospace; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1540" height="1008" fill="#f3f1e6"/>
  <text x="48" y="56" class="caps muted">SYNTHETIC EXERCISE WORLD ATLAS</text>
  <text x="48" y="115" class="title ink">Nacre telecommunications</text>
  <text x="51" y="145" class="subhead muted">Fixed and radio access, fiber routes, and interconnection</text>
  <text x="1492" y="114" text-anchor="end" class="caps muted">WORLD EXTENSION</text>
  <path d="M 48,975 H 1492" class="divider"/>
  <text x="48" y="993" class="support muted">Schematic routes and operator sites · Basemap adapted from the Synthetic Exercise World atlas</text>
  <text x="1492" y="993" text-anchor="end" class="support muted">CC BY 4.0</text>

