        <path d="M 482,384 C 574,383 642,399 709,425" class="route-outline"/>
        <path d="M 482,384 C 574,383 642,399 709,425" class="connection shared-terrestrial"/>
      </g>
      <g id="route-F07" data-service="shared-transit" data-medium="terrestrial">
