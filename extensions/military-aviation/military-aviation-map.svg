<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" viewBox="0 0 1540 1008" role="img" aria-labelledby="title description">
  <title id="title">Nacre military aviation — airfields and support</title>
  <desc id="description">Four fictional military transport airfields, their civil airport partners, radar reporting sites, aviation kerosene pipelines, and road and maritime logistics links.</desc>
  <defs>
    <linearGradient id="sea" x2="0" y2="1">
      <stop stop-color="#1b3946"/>
      <stop offset="1" stop-color="#182932"/>
    </linearGradient>
    <pattern id="graticule" width="66" height="66" patternUnits="userSpaceOnUse">
      <path d="M 66,0 H 0 V 66" fill="none" stroke="#bbcfd4" stroke-opacity=".12"/>
    </pattern>
    <clipPath id="map-frame"><rect x="48" y="171" width="1052" height="786" rx="12"/></clipPath>
    <marker id="fuel-arrow" viewBox="0 0 8 8" refX="11" refY="4" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M 0,0 8,4 0,8 Z" fill="#fbb792"/>
    </marker>
    <style>
      text { font-family: 'DejaVu Sans', sans-serif; }
      .ink { fill: #243641; }
      .muted { fill: #51636c; }
      .light { fill: #eff4f4; }
      .caps { font-size: 13px; font-weight: 700; letter-spacing: 2.2px; }
      .title { font-size: 58px; font-weight: 700; letter-spacing: -2px; }
      .subhead { font-size: 18px; }
      .area { fill: #c0d0d7; font-size: 13px; letter-spacing: 2.2px; }
      .place, .site-name { fill: #fff9ec; stroke: #172b37; stroke-width: 4px; stroke-linejoin: round; paint-order: stroke fill; }
      .place { font-weight: 700; font-size: 17px; }
      .site-name { font-size: 13px; }
      .body { font-size: 15px; font-weight: 700; }
      .support { font-size: 13px; }
      .small { font-size: 12px; }
      .sidebar { fill: #fffcf5; stroke: #d1d0c7; }
      .divider { stroke: #d1d0c7; }
      .route-id { fill: #f6f6ef; font: 700 11.5px 'DejaVu Sans Mono', monospace; text-anchor: middle; }
      .pipeline, .road, .sea-link, .liaison, .route-outline { fill: none; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
      .route-outline { stroke: #162c37; stroke-width: 6.4; }
      .pipeline { stroke: #fbb792; stroke-width: 3.5; }
      .road { stroke: #98ebcf; stroke-width: 3.3; stroke-dasharray: 8 5; }
      .sea-link { stroke: #a7d8ff; stroke-width: 3.3; stroke-dasharray: 12 5 2 5; }
      .liaison { stroke: #e2eced; stroke-width: 1.7; stroke-dasharray: 2 5; }
    </style>
  </defs>

