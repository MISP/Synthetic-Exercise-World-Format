  <text x="48" y="56" class="caps muted">SYNTHETIC EXERCISE WORLD ATLAS</text>
  <text x="48" y="115" class="title ink">Nacre military aviation</text>
  <text x="51" y="145" class="subhead muted">Airfields, radar reporting, fuel supply, and logistics</text>
  <text x="1492" y="114" text-anchor="end" class="caps muted">WORLD EXTENSION</text>
  <path d="M 48,975 H 1492" class="divider"/>
  <text x="48" y="993" class="support muted">Schematic sites and connections · Basemap adapted from the Synthetic Exercise World atlas</text>
  <text x="1492" y="993" text-anchor="end" class="support muted">CC BY 4.0</text>

